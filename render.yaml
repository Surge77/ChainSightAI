# Render Blueprint. Lives at the repository root because that is the only place Render looks.
#
# What it buys over clicking through the dashboard is that the service is described in the
# same history as the application: the health check path, the Dockerfile, and — the part that
# actually bites — the fact that all four secrets are `sync: false` and therefore cannot be
# populated from this file by anybody, including a future edit to it.
#
# `deploy/docker/` holds the image this points at, and `deploy/docker/README.md` is the
# runbook. The Hugging Face Space in `deploy/hf/` is the same application for a platform that
# fixes its port and configures itself from a README; neither deployment is derived from the
# other and `tests/` checks both against the application they deploy.

services:
  - type: web
    name: chainsight
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/docker/Dockerfile
    # The repository root, not `deploy/docker/`. The image copies `src/`, `pyproject.toml`
    # and the committed sample, and none of those are beside the Dockerfile.
    dockerContext: .

    # `/` is a 303 to the sign-in page, and a health check that follows redirects is a health
    # check that passes when the router works and the templates do not. `/login` renders a
    # real page, touches the template loader and the CSRF dependency, and needs no session
    # and no row from the database — so a sleeping Postgres cannot fail the deploy.
    healthCheckPath: /login

    envVars:
      # All four are `sync: false`: Render prompts for them and stores them itself, and
      # nothing here or in any future edit to this file can supply a value. A secret in a
      # blueprint is a secret in git history, which is the failure this avoids by being
      # unable to express it.
      - key: CHAINSIGHT_SESSION_SECRET
        sync: false
      - key: CHAINSIGHT_DATABASE
        sync: false
      - key: CHAINSIGHT_ADMIN_EMAIL
        sync: false
      - key: CHAINSIGHT_ADMIN_PASSWORD
        sync: false
