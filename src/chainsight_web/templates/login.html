{% extends "base.html" %}
{% block title %}Sign in — ChainSight{% endblock %}

{% block content %}
  <h1>Sign in</h1>
  <p class="lede">
    An operator account sees its own orders and their predictions, and nothing else.
  </p>

  <form class="stack card" method="post" action="/login">
    <label>
      Email
      <input type="email" name="email" autocomplete="username" required maxlength="320" />
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required
             maxlength="72" />
    </label>
    <div class="actions">
      <button class="primary" type="submit">Sign in</button>
      <a href="/register">Register instead</a>
    </div>
  </form>
{% endblock %}
