{% extends "base.html" %}
{% block title %}Sign in — ChainSight{% endblock %}

{% block content %}
  <div class="auth">
    <h1>Sign in</h1>
    <p class="lede">
      Enter orders and see how likely each one is to arrive late. You only ever see your
      own orders.
    </p>

    <form class="stack card" method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label>
        Email
        <input type="email" name="email" autocomplete="username" required maxlength="320"
               autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required
               maxlength="72" />
      </label>
      <div class="actions">
        <button class="primary" type="submit">Sign in</button>
        <a href="/register">Register instead</a>
      </div>
    </form>

    <p class="auth-aside">
      Are you an administrator? <a href="/admin/login">Sign in here instead</a>.
    </p>
  </div>
{% endblock %}
