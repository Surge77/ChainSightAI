name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint, types, tests, curriculum
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Types
        run: pyright

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      # Two runs on purpose. The default run is the policy; the strict run records how much
      # of the code leans on names that were revised but never actually executed in a
      # notebook. It is allowed to fail without failing the build.
      - name: Curriculum gate
        run: python scripts/check_taught.py

      - name: Curriculum gate (strict, informational)
        continue-on-error: true
        run: python scripts/check_taught.py --strict

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
