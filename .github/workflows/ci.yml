name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint, types, tests, curriculum
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Types
        run: pyright

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml

      # Two runs on purpose. The default run is the policy; the strict run records how much
      # of the code leans on names that were revised but never actually executed in a
      # notebook. It is allowed to fail without failing the build.
      - name: Curriculum gate
        run: python scripts/check_taught.py

      - name: Curriculum gate (strict, informational)
        continue-on-error: true
        run: python scripts/check_taught.py --strict

      # `docs/data_audit.md` is generated from `src/chainsight/columns.py`. A stale copy is a
      # document that describes a drop-list the code stopped believing, which is worse than
      # no document at all.
      - name: Audit document matches the column contract
        run: python scripts/render_audit.py --check

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # The application's data lives in Postgres in any deployment whose filesystem does not
  # survive a restart, and until this job existed the dialect it served on was the one
  # dialect nothing tested. SQLite hands back naive datetimes from a timezone-aware column
  # and Postgres hands back aware ones; that difference is a `TypeError` rather than a wrong
  # answer, and it would have surfaced in a container rather than here.
  postgres:
    name: web suite on postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chainsight
          POSTGRES_PASSWORD: not-a-real-password
          POSTGRES_DB: chainsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,postgres,dev]"

      # Only the web tests. Everything under `chainsight` is pandas and scikit-learn and
      # never touches a database, so running it twice would buy nothing but minutes.
      - name: Web suite against Postgres
        env:
          CHAINSIGHT_TEST_DATABASE: postgresql+psycopg://chainsight:not-a-real-password@localhost:5432/chainsight
        run: pytest -q tests/test_web_*.py
