name: Bug report
description: Something behaves differently from what the documentation says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue — anything that would let someone read another user's
        predictions, reach the admin role, or execute code — do not open an issue. Use a
        private security advisory instead. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence of commands that shows it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full traceback or the exact terminal output. Not a screenshot.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: "`git rev-parse --short HEAD`, or a tag."
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python and OS
      placeholder: "3.11.9 on Windows 11"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: "`pip install -e \".[web,dev]\"` was run against this checkout"
          required: true
        - label: "`pytest -q` passes on a clean checkout of the same commit"
